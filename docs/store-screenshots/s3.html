<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{width:1280px;height:800px;background:#ededed;overflow:hidden}
.ml{background:#fff159;height:56px;display:flex;align-items:center;padding:0 40px;gap:20px}
.ml .logo{font-weight:700;color:#333}
.ml .search{flex:1;max-width:560px;background:#fff;border-radius:4px;height:34px}
.wrap{display:flex;padding:34px 40px;gap:34px}
.gallery{width:80px;display:flex;flex-direction:column;gap:8px}
.gallery div{width:70px;height:70px;border:1px solid #e2e6ee;border-radius:8px;background:#f6f7f9}
.photo{width:340px;height:340px;border-radius:10px;background:linear-gradient(135deg,#e7effc,#eafaff);display:flex;align-items:center;justify-content:center;font-size:64px}
.info{flex:1}
.info .new{color:#999;font-size:13px}
.info h2{font-size:22px;color:#333;margin:6px 0 14px;font-weight:600;max-width:520px}
.info .price{font-size:38px;color:#333;font-weight:300}
.info .full{display:inline-block;background:#00a650;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:4px;margin-top:14px}
.buy{margin-top:22px;width:260px}
.buy button{width:100%;padding:12px;border:0;border-radius:6px;font-size:15px;font-weight:600;margin-bottom:10px}
.b1{background:#3483fa;color:#fff}
.b2{background:#e3edfb;color:#3483fa}
/* painel da extensão */
.panel{position:absolute;right:26px;bottom:26px;width:250px;background:#0a1428;color:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.35);overflow:hidden}
.panel .ph{background:linear-gradient(120deg,#1e6fff,#22d3ee);padding:11px 14px;font-weight:700;display:flex;justify-content:space-between}
.panel .pb{padding:14px}
.panel .tgt{font-size:13px;margin-bottom:12px}
.panel .tgt b{color:#7fe9fb}
.panel .save{width:100%;background:#1e6fff;color:#fff;border:0;border-radius:9px;padding:12px;font-weight:700;font-size:14px}
.panel .msg{margin-top:9px;font-size:12px;color:#7ee6b0}
</style></head><body>
<div class="ml"><span class="logo">● mercado livre</span><div class="search"></div></div>
<div class="wrap">
  <div class="gallery"><div></div><div></div><div></div><div></div></div>
  <div class="photo">🐱</div>
  <div class="info">
    <div class="new">Novo | +100 vendidos</div>
    <h2>Ração Quatree Supreme 3kg para Gatos Castrados Sênior</h2>
    <div class="price">R$ 76<sup style="font-size:20px">53</sup></div>
    <span class="full">✓ FULL — Enviado pelo Mercado Livre</span>
    <div class="buy"><button class="b1">Comprar agora</button><button class="b2">Adicionar ao carrinho</button></div>
  </div>
</div>
<div class="panel">
  <div class="ph"><span>🔎 FinanceEcom — Análise</span><span>—</span></div>
  <div class="pb">
    <div class="tgt">Alvo: <b>Ração Quatree 3kg</b></div>
    <button class="save">💾 Salvar na análise</button>
    <div class="msg">✅ Concorrente salvo!</div>
  </div>
</div>
</body></html>
