<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — FinanceEcom Free</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="admin-body">
  <header class="admin-header">
    <span class="logo">FinanceEcom <strong>Free</strong> · Painel</span>
    <button id="logout" class="btn-ghost" hidden>Sair</button>
  </header>

  <main class="admin-main">
    <!-- Login -->
    <section id="login-view" class="card login-card">
      <h2>Acesso restrito</h2>
      <p class="muted">Informe o token de administrador.</p>
      <label>Token
        <input type="password" id="token-input" placeholder="Token de admin" />
      </label>
      <button id="login-btn">Entrar</button>
      <p id="login-msg" class="form-msg"></p>
    </section>

    <!-- Dashboard -->
    <section id="dashboard-view" hidden>
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-label">Total de clientes</span>
          <span class="stat-value" id="stat-total">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Novos (7 dias)</span>
          <span class="stat-value" id="stat-last7">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Visitas na página</span>
          <span class="stat-value" id="stat-visits">—</span>
        </div>
        <div class="stat-card">
          <span class="stat-label">Taxa de conversão</span>
          <span class="stat-value" id="stat-conversion">—</span>
        </div>
      </div>

      <!-- Criar cliente manualmente -->
      <div class="card create-card">
        <h3>Adicionar cliente manualmente</h3>
        <form id="create-form" class="inline-form">
          <input type="text" name="name" placeholder="Nome" required />
          <input type="email" name="email" placeholder="E-mail" required />
          <input type="tel" name="whatsapp" placeholder="WhatsApp (opcional)" />
          <select name="marketplace">
            <option value="">Marketplace</option>
            <option>Mercado Livre</option>
            <option>Shopee</option>
            <option>Amazon</option>
            <option>Outro</option>
          </select>
          <button type="submit" class="btn-inline">Adicionar</button>
        </form>
        <p id="create-msg" class="form-msg"></p>
      </div>

      <div class="table-header">
        <h3>Clientes cadastrados</h3>
        <div class="table-actions">
          <input type="search" id="search-input" placeholder="Buscar nome ou e-mail..." class="search-input" />
          <button id="export-btn" class="btn-ghost">Exportar CSV</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="leads-table">
          <thead>
            <tr>
              <th>Nome</th>
              <th>E-mail</th>
              <th>WhatsApp</th>
              <th>Marketplace</th>
              <th>Cadastro</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/admin.js"></script>
</body>
</html>
