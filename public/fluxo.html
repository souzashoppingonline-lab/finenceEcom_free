<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
  <link rel="apple-touch-icon" href="/img/logo-mark.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fluxo de Caixa — FinanceEcom Free</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="app-body">
  <div id="sidebar-root"></div>
  <main class="app-content">
    <div class="dash-head">
      <h1>💵 Fluxo de Caixa</h1>
      <p class="muted">O extrato real do seu negócio: entradas, saídas e saldo projetado.</p>
    </div>

    <div class="v-controls">
      <div class="v-ctrl"><label>Mês</label><input type="month" id="cf-month" /></div>
      <div class="v-ctrl"><label>Tipo</label>
        <select id="cf-filter">
          <option value="">Todos</option><option value="income">Entradas</option>
          <option value="expense">Saídas</option><option value="boleto">Boletos</option><option value="cartao">Cartões</option>
        </select>
      </div>
    </div>

    <div class="stats-grid" id="cf-kpis"></div>

    <div class="card">
      <h3>Novo lançamento manual</h3>
      <form id="cf-form">
        <div class="sales-grid">
          <label>Tipo
            <select name="type"><option value="income">Entrada</option><option value="expense">Saída</option></select>
          </label>
          <label>Data<input type="date" name="date" required /></label>
          <label>Valor (R$)<input type="number" name="value" min="0" step="0.01" required placeholder="0,00" /></label>
          <label>Categoria<input type="text" name="category" placeholder="Ex.: Aluguel, Vendas..." /></label>
          <label>Empresa<input type="text" name="empresa" placeholder="Opcional" /></label>
          <label>Motivo<input type="text" name="reason" placeholder="Descrição" /></label>
        </div>
        <div class="form-row-btns"><button type="submit">Lançar</button></div>
        <p id="cf-msg" class="form-msg"></p>
      </form>
    </div>

    <h3 class="v-section-title">Resumo por empresa</h3>
    <div id="cf-company" class="reports-grid"></div>

    <h3 class="v-section-title">Lançamentos do mês</h3>
    <div class="table-wrap">
      <table id="cf-table">
        <thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Empresa</th><th>Motivo</th><th>Valor</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <h3 class="v-section-title">Previsão de caixa (compromissos pendentes)</h3>
    <div class="table-wrap">
      <table id="cf-forecast">
        <thead><tr><th>Vencimento</th><th>Descrição</th><th>Tipo</th><th>Valor</th><th>Saldo projetado</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth-common.js"></script>
  <script src="/js/app-shell.js"></script>
  <script src="/js/fluxo.js"></script>
</body>
</html>
