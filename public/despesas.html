<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <link rel="icon" type="image/svg+xml" href="/img/logo-mark.svg" />
  <link rel="apple-touch-icon" href="/img/logo-mark.svg" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Despesas & DRE — FinanceEcom Free</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="app-body">
  <div id="sidebar-root"></div>
  <main class="app-content">
    <div class="dash-head dash-head-row">
      <div>
        <h1>Despesas &amp; DRE Integrado</h1>
        <p class="muted">Gestão de custos com integração automática às vendas.</p>
      </div>
      <div class="head-actions">
        <select id="sel-month" class="filter-inp"></select>
        <select id="sel-year" class="filter-inp"></select>
      </div>
    </div>

    <div class="tabs">
      <button class="tab is-active" data-tab="dre">DRE &amp; Despesas</button>
      <button class="tab" data-tab="be">Ponto de Equilíbrio</button>
    </div>

    <!-- ABA DRE & DESPESAS -->
    <section class="tab-panel" data-panel="dre">
      <div class="despesas-layout">
        <div class="despesas-main">
          <div class="card">
            <h3>Nova despesa</h3>
            <form id="exp-form">
              <span class="field-label">Tipo</span>
              <div class="status-select" id="tipo-select" style="grid-template-columns:1fr 1fr">
                <button type="button" class="status-btn is-active" data-t="fixed">Custo Fixo</button>
                <button type="button" class="status-btn" data-t="operational">Custo Operacional</button>
              </div>
              <input type="hidden" name="type" value="fixed" />
              <div class="two-col">
                <label>Data<input type="date" name="date" required /></label>
                <label>Categoria<input type="text" name="category" placeholder="Ex.: Aluguel, Software..." /></label>
              </div>
              <label>Descrição<input type="text" name="description" required placeholder="Ex.: Aluguel de galpão, contador..." /></label>
              <label>Valor (R$)<input type="number" name="value" min="0" step="0.01" required placeholder="0,00" /></label>
              <label class="checkbox"><input type="checkbox" name="recurring" /> <span>Recorrente mensal</span></label>
              <button type="submit" id="save-exp" class="btn-cadastrar">+ Cadastrar</button>
              <button type="button" id="exp-cancel" class="btn-ghost" hidden>Cancelar</button>
              <p id="exp-msg" class="form-msg"></p>
            </form>
          </div>

          <h3 class="v-section-title" id="lanc-title">Lançamentos</h3>
          <div class="table-wrap">
            <table id="exp-table">
              <thead><tr><th>Descrição</th><th>Categoria</th><th>Tipo</th><th>Valor</th><th></th></tr></thead>
              <tbody></tbody>
            </table>
          </div>

          <h3 class="v-section-title">Despesas por categoria</h3>
          <div class="card" id="exp-donut"></div>

          <h3 class="v-section-title">DRE detalhada do mês</h3>
          <div class="card" id="dre-detail"></div>
        </div>

        <aside class="despesas-side">
          <div class="card">
            <h3 id="dre-year-title">DRE Resumida</h3>
            <table class="mini-dre"><tbody id="mini-dre-body"></tbody></table>
            <div class="mini-dre-tot" id="mini-dre-tot"></div>
          </div>
        </aside>
      </div>
    </section>

    <!-- ABA PONTO DE EQUILÍBRIO -->
    <section class="tab-panel" data-panel="be" hidden>
      <div id="be-content"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/auth-common.js"></script>
  <script src="/js/app-shell.js"></script>
  <script src="/js/dre-core.js"></script>
  <script src="/js/charts.js"></script>
  <script src="/js/despesas.js"></script>
</body>
</html>
