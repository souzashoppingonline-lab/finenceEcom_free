<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 300px; margin: 0; font-family: system-ui, sans-serif; background: #0a1428; color: #fff; }
    header { background: linear-gradient(120deg, #1e6fff, #22d3ee); padding: 12px 14px; font-weight: 700; font-size: 15px; }
    .body { padding: 14px; }
    label { display: block; font-size: 12px; color: #9fb3d0; margin: 10px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 8px; border-radius: 7px; border: 1px solid #24365e; background: #12203d; color: #fff; font-size: 12px; }
    button { width: 100%; margin-top: 10px; padding: 9px; border: 0; border-radius: 8px; background: #1e6fff; color: #fff; font-weight: 700; cursor: pointer; font-size: 13px; }
    button:hover { background: #1657d6; }
    button.ghost { background: #12203d; border: 1px solid #24365e; }
    .row { display: flex; gap: 8px; }
    .row button { margin-top: 0; }
    .status { margin-top: 12px; font-size: 12px; background: #12203d; border-radius: 8px; padding: 10px; line-height: 1.5; }
    .msg { font-size: 12px; margin-top: 8px; min-height: 14px; }
    .muted { color: #9fb3d0; }
    a { color: #7fe9fb; }
    .switch { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; font-size: 12px; }
  </style>
</head>
<body>
  <header>🔎 FinanceEcom Monitor</header>
  <div class="body">
    <label>URL do sistema</label>
    <input id="backendUrl" placeholder="https://app.financeecom.com.br" />

    <label>Seu token da extensão</label>
    <input id="extToken" placeholder="fec_..." />

    <div class="row" style="margin-top:10px">
      <button id="save">Salvar</button>
      <button id="test" class="ghost">Testar</button>
    </div>
    <div id="msg" class="msg"></div>

    <div class="switch">
      <span>Monitoramento automático</span>
      <input type="checkbox" id="monitorEnabled" style="width:auto" />
    </div>

    <div class="status" id="status">
      <div class="muted">Alvo: <span id="target">—</span></div>
      <div class="muted">Último ciclo: <span id="cycle">—</span></div>
    </div>

    <button id="sync" style="margin-top:12px">🔄 Sincronizar agora</button>
    <button id="force" class="ghost">⚡ Forçar recoleta de TODOS</button>

    <p class="muted" style="font-size:11px;margin-top:12px">
      O token fica na página <b>Análise de Produtos</b> → Configurações de IA e Extensão.
    </p>
  </div>
  <script src="popup.js"></script>
</body>
</html>
